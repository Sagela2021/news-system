name: Leon每日学术情报

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 发送今日学术邮件
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
              - name: Debug environment variables
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then echo "DEEPSEEK_API_KEY is NOT set"; else echo "DEEPSEEK_API_KEY is set (length:${#DEEPSEEK_API_KEY})"; fi
          if [ -z "$RESEND_API_KEY" ]; then echo "RESEND_API_KEY is NOT set"; else echo "RESEND_API_KEY is set (length:${#RESEND_API_KEY})"; fi
          if [ -z "$RECEIVER_EMAIL" ]; then echo "RECEIVER_EMAIL is NOT set"; else echo "RECEIVER_EMAIL is set"; fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
